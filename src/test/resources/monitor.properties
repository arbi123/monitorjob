# Comma-separated list of URLs to monitor
monitor.urls=https://eu.ebileta.al/biglietteria/listaEventiPub.do

# Alert when Ireland / Nations League appears on the ticket page.
# Events are listed like: "Tue Mar 31, 2026, 8:45 PM KOSOVE - TURQI/RUMANI"
monitor.keywords=KOSOVE - IRELAND,KOSOVE - IRANDË,KOSOVE - IRLANDË,KOSOVE - IRANDA,IRELAND,IRLANDË,IRLANDA,Irealnd,ireland,Ireland,Irlandë,irlandë,Irlanda,irlanda,Nations league,nations league,NATIONS LEAGUE,Liga e Kombeve,liga e kombeve,LIGA E KOMBEVE,Liga e Kombëve,liga e kombëve,LIGA E KOMBËVE

# Run browser without a visible window (required on Jenkins)
browser.headless=true

# Page load timeout in seconds
browser.timeout.seconds=60
